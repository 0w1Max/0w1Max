name: Commando Activity SVG

on:
  workflow_dispatch:
  schedule:
    # Раз в сутки, UTC. Не запускаем на каждом push.
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: commando-activity-publish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код профильного репозитория
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (проверено через GitHub API)

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Построить SVG по реальному календарю GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/generate.mjs --output generated/commando-activity.svg

      - name: Опубликовать SVG в отдельную ветку output
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7 (проверено через GitHub API)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'output';
            const path = 'commando-activity.svg';
            const bytes = fs.readFileSync('generated/commando-activity.svg');
            const content = bytes.toString('base64');
            let ref;
            try {
              ref = await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`});
            } catch(e) {
              if(e.status !== 404) throw e;
              await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:context.sha});
            }
            let previous;
            try {
              const result = await github.rest.repos.getContent({owner,repo,path,ref:branch});
              if (Array.isArray(result.data)) throw new Error('Expected a file');
              previous = result.data;
            } catch(e) {if(e.status !== 404)throw e;}
            if(previous && previous.content?.replace(/\s/g,'')===content) {
              core.info('SVG не изменился; новый коммит не требуется.');
            } else {
              const args = {owner,repo,path,branch,content,
                message:'chore(profile): обновить 8-bit календарь активности'};
              if(previous) args.sha=previous.sha;
              const result=await github.rest.repos.createOrUpdateFileContents(args);
              core.info(`SVG опубликован: ${result.data.commit.sha}`);
            }
