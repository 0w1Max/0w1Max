name: Commando Profile · release checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'fixtures/**'
      - 'tests*.mjs'
      - 'commando-*.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests*.mjs
      - run: node scripts/publish-daily.mjs --demo
      - run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/commando-activity.svg')"
