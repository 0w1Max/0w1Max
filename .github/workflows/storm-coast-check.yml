name: Storm Coast release validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run full regression suite
        run: node --test tests.mjs
      - name: Render demo Storm Coast and check SVG XML
        env:
          COMMANDO_LOCATION: coast
          COMMANDO_MAP_SEED: '5'
        run: |
          node scripts/generate.mjs --demo --output generated/storm-coast-demo.svg
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/storm-coast-demo.svg')"
          grep -q 'id="storm-coast-victory"' generated/storm-coast-demo.svg
          grep -q 'DEMO / TEST DATA' generated/storm-coast-demo.svg
          grep -q 'width="17" height="17" rx="3"' generated/storm-coast-demo.svg
          grep -q 'STORM COAST' generated/storm-coast-demo.svg
          if grep -Eq '[А-Яа-яЁё]' generated/storm-coast-demo.svg; then
            echo 'Cyrillic text detected in the published game'
            exit 1
          fi
