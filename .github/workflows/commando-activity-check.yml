name: Проверка 8-bit генератора

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'assets/sprites.json.gz.b64'
      - 'fixtures/**'
      - 'tests.mjs'
      - '.github/workflows/commando-activity*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Получить исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Установить Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Запустить тесты
        run: node --test tests.mjs
      - name: Создать SVG на тестовом календаре
        run: node scripts/generate.mjs --demo --output generated/demo.svg
      - name: Проверить XML и маркировку тестовых данных
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/demo.svg')"
          grep -q 'DEMO / TEST DATA' generated/demo.svg
      - name: Проверить SVG по реальной активности (без публикации)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: 0w1Max
        run: |
          node scripts/generate.mjs --output generated/real.svg
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('generated/real.svg')"
          if grep -q 'DEMO / TEST DATA' generated/real.svg; then
            echo 'Ошибка: генератор вернул демо вместо реальных данных'
            exit 1
          fi
      - name: Сохранить SVG для визуальной приёмки
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commando-svg-preview
          path: |
            generated/demo.svg
            generated/real.svg
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Встроенный SVG-предпросмотр в Draft PR
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/commando-activity-svg-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Получить именно проверенный коммит PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Установить Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Создать пять биомов и случайную карту
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: 0w1Max
        run: node scripts/preview-gallery.mjs
      - name: Проверить SVG галереи
        run: |
          python3 -c "from pathlib import Path; import xml.etree.ElementTree as ET; files=[Path('preview/commando-activity.svg'),Path('preview/desert-canyon.svg'),*sorted(Path('preview/biomes').glob('*.svg'))]; assert len(files)==7, len(files); [ET.parse(p) for p in files]; print('PASS: 7 SVG')"
      - name: Опубликовать галерею SVG только в ветке Draft PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            if (!pr || pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo ||
                pr.head.ref !== 'feature/commando-activity-svg-v1') {
              throw new Error('Предпросмотр разрешён только для собственной ветки Draft PR');
            }
            const branch = pr.head.ref;
            const current = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
            if (current.data.object.sha !== pr.head.sha) {
              core.warning('Ветка обновлена за время проверки — устаревший SVG не публикуем.');
              return;
            }
            const paths = [
              'preview/commando-activity.svg', 'preview/desert-canyon.svg',
              ...['industrial','jungle','desert','volcano','snow'].map(b => 'preview/biomes/'+b+'.svg'),
              'preview/biomes/manifest.json'
            ];
            for (const path of paths) {
              const bytes = fs.readFileSync(path);
              const blobSha = crypto.createHash('sha1')
                .update('blob ' + bytes.length + '\0')
                .update(bytes).digest('hex');
              let previous;
              try {
                const response = await github.rest.repos.getContent({owner, repo, path, ref: branch});
                if (Array.isArray(response.data)) throw new Error('Ожидался SVG-файл');
                previous = response.data;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (previous?.sha === blobSha) {
                core.info('SVG не изменился: ' + path);
                continue;
              }
              const args = {owner,repo,path,branch,
                content: bytes.toString('base64'),
                message: 'chore(profile): обновить SVG-предпросмотр в Draft PR'};
              if (previous) args.sha = previous.sha;
              const written = await github.rest.repos.createOrUpdateFileContents(args);
              core.info('Предпросмотр опубликован: ' + path + ' ' + written.data.commit.sha);
            }
